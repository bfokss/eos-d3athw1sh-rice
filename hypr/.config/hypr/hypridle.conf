general {
    lock_cmd = pidof hyprlock || hyprlock --config ~/.config/hypr/hyprlock/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300                                # 5 minut
    on-timeout = loginctl lock-session           # wysyła sygnał do zablokowania
}

listener {
    timeout = 330                                # 5.5 minuty
    on-timeout = hyprctl dispatch dpms off       # wyłącza monitor
    on-resume = hyprctl dispatch dpms on         # włącza monitor po ruchu myszką
}