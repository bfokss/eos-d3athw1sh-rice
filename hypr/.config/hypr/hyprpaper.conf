preload = ~/.config/hypr/current_wallpaper

wallpaper {
    monitor = DP-1
    path = ~/.config/hypr/current_wallpaper
    fit_mode = cover
}

wallpaper {
    monitor = HDMI-A-1
    path = ~/.config/hypr/current_wallpaper
    fit_mode = cover
}

wallpaper {
    monitor = eDP-1
    path = ~/.config/hypr/current_wallpaper
    fit_mode = cover
}


splash = false
ipc = off