#Imports
source = ~/.config/hypr/hyprlock/current_monitor.conf

#Background 
background {
    monitor =
    path = ~/.config/hypr/hyprlock/current_wallpaper
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

#General settings
general {
    no_fade_in = false              # Enable smooth fade-in animation
    grace = 0                       # Grace period before requiring password
    disable_loading_bar = false     # Show loading indicator
    hide_cursor = false
}

#User profile picture
image {
    monitor = $main_screen
    #path = ~/.config/hypr/hyprlock/profile.jpg
    border_size = 2
    border_color = rgba(255, 255, 255, 0)
    size = 160
    rounding = -1                   # -1 for perfect circle
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, 40
    halign = center
    valign = center
}

#Date
label {
    monitor = $main_screen
    text = cmd[update:1000] echo -e "$(LC_TIME=pl_PL.UTF-8 date +"%A, %d %B")"
    color = rgba(216, 222, 233, 0.90)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, 350
    halign = center
    valign = center
}

#Time
label {
    monitor = $main_screen
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.90)
    font_size = 120
    font_family = JetBrainsMono Nerd Font
    position = 0, 230
    halign = center
    valign = center
}

#Username
label {
    monitor = $main_screen
    text = $USER
    color = rgba(216, 222, 233, 0.80)
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -130
    halign = center
    valign = center
}
k
#Password input field
input-field {
    monitor = $main_screen
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.2                 # Password dot size (0.2-0.8)
    dots_spacing = 0.2              # Spacing between dots (0.0-1.0)
    dots_center = true              # Center dots in field
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgba(143, 245, 134, 1)
    capslock_color = rgba(219, 242, 39, 1)

    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##8ff58699">Password</span></i>
    hide_input = false              # Show/hide password dots
    position = 0, -210
    halign = center
    valign = center
    #Error handling
    fail_text =<b><span foreground="##8ff58699">Wrong password</span></b>
    fail_color = rgb(255, 75, 107)     # Red color on failed login
    fail_timeout = 2000                # Show fail color for 2 seconds
    fail_transition = 300              # Transition duration
}



#Music widget
label {
    monitor = $main_screen
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock/Scripts/songdetail.sh)"
    color = rgba(143, 245, 134, 0.8)
    font_size = 16
    font_family = JetBrains Mono Nerd Italic
    position = 0, 50
    halign = center
    valign = bottom
}